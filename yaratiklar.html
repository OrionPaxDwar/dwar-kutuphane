<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dwar Kütüphane - Yaratıklar</title>

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/yaratiklar.css">
</head>

<body>

    <a href="index.html" class="back-home-btn">← Ana Sayfaya Dön</a>

    <main class="creature-page">

        <section class="creature-header">
            <span>DWAR KÜTÜPHANE</span>
            <h1>Yaratık Kitabı</h1>
            <p>
                Yaratıkları görsel kart sistemiyle incele. Kartın üzerine gelince
                can, hasar, para ve konum bilgileri görünür. Karta tıklayınca ödül listesi açılır.
            </p>
        </section>

        <section class="creature-tools">
            <input type="text" id="creatureSearch" placeholder="Yaratık adı ara...">
            <input type="number" id="minLevel" placeholder="Min seviye">
            <input type="number" id="maxLevel" placeholder="Max seviye">
            <input type="text" id="locationSearch" placeholder="Konum ara...">
        </section>

        <section class="creature-grid" id="creatureGrid"></section>

    </main>

    <div class="creature-popup" id="creaturePopup">
        <div class="popup-backdrop" id="popupBackdrop"></div>

        <div class="popup-box">
            <button class="popup-close" id="popupClose">×</button>

            <div class="popup-top">
                <img id="popupImage" src="" alt="">
                <div>
                    <span id="popupLevel"></span>
                    <h2 id="popupName"></h2>
                    <p id="popupStats"></p>
                    <p id="popupLocation"></p>
                </div>
            </div>

            <div class="popup-rewards">
                <h3>Ödül Listesi</h3>
                <div id="popupRewards"></div>
            </div>
        </div>
    </div>

    <script src="js/yaratiklar.js"></script>
</body>
</html>
