<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Hayran Görevleri - Dwar Kütüphane</title>

    <!-- TEMEL CSS -->
    <link rel="stylesheet" href="../../css/base/reset.css">
    <link rel="stylesheet" href="../../css/base/layout.css">
    <link rel="stylesheet" href="../../css/base/buttons.css">

    <!-- BİLEŞEN CSS -->
    <link rel="stylesheet" href="../../css/components/info-boxes.css">
    <link rel="stylesheet" href="../../css/components/tables.css">

    <!-- SAYFA CSS -->
    <link rel="stylesheet" href="../../css/pages/hayran-gorevleri.css">

    <!-- MOBİL CSS -->
    <link rel="stylesheet" href="../../css/base/responsive.css">
</head>

<body>

    <a href="../../index.html" class="back-home-btn">
        Ana Sayfaya Dön
    </a>

    <a href="../itibarlar.html" class="back-section-btn">
        İtibarlara Dön
    </a>

    <main class="page-shell fan-quests-page">

        <section class="fan-quests-hero">
            <span>Özel Rehber</span>

            <h1>Hayran Görevleri</h1>

            <p>
                İtibarların Hayran aşamasında istenen görevleri, NPC konumlarını,
                kaynakları, yaratıkları ve seviye şartlarını burada toplayacağız.
            </p>
        </section>

        <section class="fan-filter-panel">

            <label>
                İtibar / Görev Ara
                <input type="text" id="fanSearchInput" placeholder="Örn: Kötülük, Flaundin, Yaratık...">
            </label>

            <label>
                Seviye
                <select id="fanLevelFilter">
                    <option value="all">Tüm Seviyeler</option>
                    <option value="5">Sv5</option>
                    <option value="6">Sv6</option>
                    <option value="7">Sv7</option>
                    <option value="8">Sv8+</option>
                </select>
            </label>

            <label>
                Görev Tipi
                <select id="fanTypeFilter">
                    <option value="all">Tüm Tipler</option>
                    <option value="kaynak">Kaynak Teslimi</option>
                    <option value="yaratik">Yaratık Kesme</option>
                    <option value="npc">NPC / Konum</option>
                    <option value="karisik">Karışık Görev</option>
                </select>
            </label>

            <button class="gold-btn" id="fanResetBtn">
                Filtreyi Temizle
            </button>

        </section>

        <section class="fan-level-summary">
            <div>
                <strong>Sv5+</strong>
                <span>Genel hayran görevleri</span>
            </div>

            <div>
                <strong>Sv6+</strong>
                <span>Özel bölge ve NPC görevleri</span>
            </div>

            <div>
                <strong>Sv7+</strong>
                <span>İleri seviye hayran zincirleri</span>
            </div>
        </section>

        <section class="fan-quest-list" id="fanQuestList"></section>

    </main>

    <script src="../../data/itibarlar/hayran-kaynaklari.js"></script>
    <script src="../../js/pages/hayran-gorevleri.js"></script>
    <script src="../../js/main.js"></script>
</body>
</html>
