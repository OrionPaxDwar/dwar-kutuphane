<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Hayran ve Yücelik Görevleri - Dwar Kütüphane</title>

    <link rel="stylesheet" href="../../css/base/reset.css">
    <link rel="stylesheet" href="../../css/base/layout.css">
    <link rel="stylesheet" href="../../css/base/buttons.css">

    <link rel="stylesheet" href="../../css/components/info-boxes.css">
    <link rel="stylesheet" href="../../css/components/tables.css">

    <link rel="stylesheet" href="../../css/pages/hayran-gorevleri.css">

    <link rel="stylesheet" href="../../css/base/responsive.css">
</head>

<body>

    <a href="../../index.html" class="back-home-btn">
        Ana Sayfaya Dön
    </a>

    <a href="../itibarlar.html" class="back-section-btn">
        İtibarlara Dön
    </a>

    <main class="page-shell fan-quests-page">

        <section class="fan-quests-hero">
            <span>İtibar Rehberi</span>

            <h1>Hayran ve Yücelik Görevleri</h1>

            <p>
                İtibarların Hayran, Yücelik ve özel görev aşamalarında istediği kaynakları,
                NPC konumlarını ve notları burada tek listede topluyoruz.
            </p>
        </section>

        <section class="fan-filter-panel">

            <label>
                İtibar / Görev Ara
                <input type="text" id="fanSearchInput" placeholder="Örn: Şans, Kötülük, Flaundin, Ejder...">
            </label>

            <label>
                Seviye
                <select id="fanLevelFilter">
                    <option value="all">Tüm Seviyeler</option>
                    <option value="5">Sv5</option>
                    <option value="6">Sv6</option>
                    <option value="7">Sv7</option>
                    <option value="11">Sv11</option>
                    <option value="12">Sv12</option>
                    <option value="15">Sv15</option>
                    <option value="16">Sv16</option>
                </select>
            </label>

            <label>
                Madalyon
                <select id="fanMedalFilter">
                    <option value="all">Tüm Görevler</option>
                    <option value="hayran">Hayran Madalyonu</option>
                    <option value="yucelik">Yücelik Madalyonu</option>
                    <option value="ozel">Özel Görev</option>
                </select>
            </label>

            <button class="gold-btn" id="fanResetBtn">
                Filtreyi Temizle
            </button>

        </section>

        <section class="fan-layout">

            <aside class="fan-sidebar">
                <div class="fan-sidebar-title">
                    Görev Listesi
                </div>

                <div class="fan-menu-list" id="fanMenuList"></div>
            </aside>

            <section class="fan-detail-area" id="fanDetailArea">
                <div class="fan-detail-empty">
                    Soldan bir görev seç.
                </div>
            </section>

        </section>

    </main>

    <script src="../../data/itibarlar/hayran-kaynaklari.js"></script>
    <script src="../../js/pages/hayran-gorevleri.js"></script>
    <script src="../../js/main.js"></script>
</body>
</html>
